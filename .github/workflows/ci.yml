name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vo
          POSTGRES_PASSWORD: vo
          POSTGRES_DB: value_office_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://vo:vo@localhost:5432/value_office_ci
      TEST_DATABASE_URL: postgres://vo:vo@localhost:5432/value_office_test
      # Created, reset, migrated and Horizon-seeded by e2e/global-setup.ts
      E2E_DATABASE_URL: postgres://vo:vo@localhost:5432/value_office_e2e
      VO_DEV_USER_EMAIL: ci@cardaxia.ai
      VO_DEV_USER_NAME: CI Consultant
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=vo psql -h localhost -U vo -d value_office_ci -c "create database value_office_test"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Migrations apply to a fresh database
        run: npm run db:migrate
      - name: No schema drift between schema.ts and migrations
        run: npm run db:verify
      - name: Seed Horizon fixture through commands
        run: npm run db:seed:horizon
      # Chromium is needed by Vitest too: issued reports are rendered to PDF server-side.
      - run: npx playwright install --with-deps chromium
      - name: PDF generation smoke test (Horizon reports, Playwright Chromium)
        run: npm run reports:smoke
      - name: PDF generation smoke test (serverless Chromium, as on Vercel)
        run: VO_PDF_RUNTIME=serverless npm run reports:smoke
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Production-like deployment smoke test (least-privilege DB role, password auth, S3 storage)
        run: ./scripts/production-smoke.sh
        env:
          SMOKE_ADMIN_URL: postgres://vo:vo@localhost:5432/postgres
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            production-smoke-server.log
          retention-days: 7
